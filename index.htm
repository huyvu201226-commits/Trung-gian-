<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J-HUSH</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;

    background:
    linear-gradient(
    135deg,
    #050816,
    #0d1b3d,
    #000000);

    display:flex;
    justify-content:center;
    align-items:center;
}

#welcome{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:1s;
}

.logo{

    width:180px;
    height:180px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #4da3ff;

    box-shadow:
    0 0 20px #4da3ff,
    0 0 40px #4da3ff;
}

.shop-name{

    margin-top:25px;

    color:white;

    font-size:42px;

    font-weight:bold;

    letter-spacing:4px;
}

.sub{

    margin-top:10px;

    color:#8fbfff;

    font-size:18px;
}

.enter{

    margin-top:40px;

    padding:15px 35px;

    border-radius:50px;

    color:white;

    border:2px solid #4da3ff;

    font-size:20px;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

.fade{

opacity:0;

}

</style>

</head>

<body>

<div id="welcome">

<img src="logo.png" class="logo">

<div class="shop-name">
J-HUSH
</div>

<div class="sub">

HUY ĐỨC

</div>

<div class="enter">
✨ NHẤP VÀO ĐỂ TRUY CẬP WEBSITE ✨
</div>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const welcome =
document.getElementById("welcome");

const music =
document.getElementById("music");

welcome.onclick = async () => {

try{
await music.play();
}catch(e){}

welcome.classList.add("fade");

setTimeout(()=>{

window.location.href =
"https://sites.google.com/view/shop-acc-huigaming";

},1500);

};

</script>

</body>
</html>
